<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
    <style>
        body {
            margin: 0;
            padding: 32px 18px;
            font-family: Arial, sans-serif;
            color: #10458d;
            background: linear-gradient(180deg, #d5edff, #f4faff, #d3eaff);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .form-container {
            width: min(100%, 560px);
            padding: 28px;
            box-sizing: border-box;
            background: #ffffff;
            border: 1px solid #a6d4ff;
            border-radius: 12px;
            box-shadow: 0 8px 20px #2868a638;
        }
        .form-container h2 {
            margin: 0 0 20px;
            color: #10458d;
            font-family: Georgia, serif;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .inline-label {
            display: inline;
            font-weight: normal;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            padding: 9px 10px;
            box-sizing: border-box;
            border: 1px solid #a6c9eb;
            border-radius: 6px;
            background: #f8fcff;
            color: #10458d;
            font: inherit;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        input[type="url"],
        select {
            min-height: 38px;
        }
        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 6px;
            accent-color: #1765c0;
        }
        textarea {
            height: 90px;
            resize: vertical;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .buttons button {
            padding: 10px 16px;
            cursor: pointer;
            color: #ffffff;
            background: #0752b4;
            border: 0;
            border-radius: 6px;
            font: inherit;
            font-weight: bold;
        }
        .buttons button:hover {
            background: #2879d7;
        }
        @media (max-width: 480px) {
            body {
                padding: 18px 12px;
            }
            .form-container {
                padding: 22px 18px;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Formulir Pendaftaran</h2>
        
        <form>
            <!-- Nama Lengkap -->
            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" placeholder="Masukkan nama">
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="nama@gmail.com">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password">
            </div>

            <!-- Umur -->
            <div class="form-group">
                <label for="umur">Umur:</label>
                <input type="number" id="umur">
            </div>

            <!-- Tanggal Lahir -->
            <div class="form-group">
                <label for="tanggal_lahir">Tanggal Lahir:</label>
                <input type="date" id="tanggal_lahir">
            </div>

            <!-- Jenis Kelamin (Radio Button) -->
            <div class="form-group">
                <label>Jenis Kelamin:</label>
                <input type="radio" id="laki" name="gender" value="Laki-laki">
                <label for="laki" class="inline-label">Laki-laki</label><br>
                <input type="radio" id="perempuan" name="gender" value="Perempuan">
                <label for="perempuan" class="inline-label">Perempuan</label>
            </div>

            <!-- Hobi (Checkbox) -->
            <div class="form-group">
                <label>Hobi:</label>
                <input type="checkbox" id="coding" value="Coding">
                <label for="coding" class="inline-label">Coding</label><br>
                <input type="checkbox" id="gaming" value="Gaming">
                <label for="gaming" class="inline-label">Gaming</label><br>
                <input type="checkbox" id="olahraga" value="Olahraga">
                <label for="olahraga" class="inline-label">Olahraga</label>
            </div>

            <!-- Jurusan (Dropdown) -->
            <div class="form-group">
                <label for="jurusan">Jurusan:</label>
                <select id="jurusan">
                    <option value="">Pilih jurusan...</option>
                    <option value="RPL">Rekayasa Perangkat Lunak</option>
                    <option value="TKJ">Teknik Komputer & Jaringan</option>
                </select>
            </div>

            <!-- Alamat -->
            <div class="form-group">
                <label for="alamat">Alamat:</label>
                <textarea id="alamat" placeholder="Masukkan alamat"></textarea>
            </div>

            <!-- Foto (File Upload) -->
            <div class="form-group">
                <label for="foto">Foto:</label>
                <input type="file" id="foto">
            </div>

            <!-- Website -->
            <div class="form-group">
                <label for="website">Website:</label>
                <input type="url" id="website" placeholder="https://website.com">
            </div>

            <!-- Tombol Aksi -->
            <div class="buttons">
                <button type="submit">Kirim</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>

</body>
</html>
