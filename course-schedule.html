<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah</title>
    <style>
        body {
            margin: 0;
            padding: 32px 18px;
            font-family: Arial, sans-serif;
            color: #10458d;
            background: linear-gradient(180deg, #d5edff, #f4faff, #d3eaff);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: min(100%, 760px);
            padding: 28px;
            box-sizing: border-box;
            background: #ffffff;
            border: 1px solid #a6d4ff;
            border-radius: 12px;
            box-shadow: 0 8px 20px #2868a638;
            overflow-x: auto;
        }
        h1 {
            margin: 0 0 25px;
            color: #10458d;
            font-family: Georgia, serif;
            text-align: center;
        }
        table {
            width: 100%;
            min-width: 560px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #a6c9eb;
            padding: 10px 12px;
            text-align: left;
        }
        th {
            font-weight: bold;
            text-align: center;
            color: #ffffff;
            background: #1765c0;
        }
        tbody tr:nth-child(even) {
            background: #edf6ff;
        }
        .center-text {
            text-align: center;
        }
        @media (max-width: 480px) {
            body {
                padding: 18px 12px;
            }
            .container {
                padding: 22px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Jadwal Kuliah</h1>
        
        <table>
             
            <!-- Header Tabel -->
            <thead>
                <tr>
                    <th>Hari</th>
                    <th>Jam</th>
                    <th>Mata Kuliah</th>
                    <th>Ruangan</th>
                </tr>
            </thead>
            
            <!-- Isi Tabel -->
            <tbody>
                <tr>
                    <td>Senin</td>
                    <td class="center-text">08:00 - 10:00</td>
                    <td>Pemrograman Web</td>
                    <td>Lab 1</td>
                </tr>
                <tr>
                    <td>Selasa</td>
                    <td class="center-text">10:00 - 12:00</td>
                    <td>Basis Data</td>
                    <td>Lab 2</td>
                </tr>
                <tr>
                    <td>Rabu</td>
                    <td class="center-text">08:00 - 10:00</td>
                    <td>Algoritma</td>
                    <td>Ruang 201</td>
                </tr>
                <tr>
                    <td>Kamis</td>
                    <td class="center-text">13:00 - 15:00</td>
                    <td>Sistem Operasi</td>
                    <td>Ruang 202</td>
                </tr>
                <!-- Baris Terakhir dengan Penggabungan Kolom (colspan) -->
                <tr>
                    <td colspan="3">Kegiatan Mahasiswa</td>
                    <td>Aula</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
