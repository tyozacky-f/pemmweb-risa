<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobi Saya</title>
    <style>
        body {
            margin: 0;
            padding: 32px 18px;
            min-height: 100vh;
            box-sizing: border-box;
            background: linear-gradient(180deg, #d5edff, #f4faff, #d3eaff);
            color: #10458d;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            justify-content: center;
        }
        .container {
            width: min(100%, 650px);
            padding: 28px;
            box-sizing: border-box;
            background: #ffffff;
            border: 1px solid #a6d4ff;
            border-radius: 12px;
            box-shadow: 0 8px 20px #2868a638;
        }
        h1, h2 {
            color: #10458d;
        }
        h1 {
            margin: 0 0 18px;
            font-family: Georgia, serif;
            text-align: center;
        }
        h2 {
            margin: 24px 0 10px;
            font-family: Georgia, serif;
        }
        p {
            margin-bottom: 10px;
        }
        ul, ol {
            margin-top: 0;
            padding-left: 25px;
        }
        li {
            margin-bottom: 5px;
        }
        @media (max-width: 480px) {
            body {
                padding: 18px 12px;
            }
            .container {
                padding: 22px 18px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hobi</h1>
        <p>Beberapa hobi saya adalah:</p>
        <ul>
            <li>Membaca</li>
            <li>Olahraga</li>
            <li>Bermain game</li>
            <li>Fotografi</li>
        </ul>

        <h2>Urutan Hobi Favorit</h2>
        <ol type="A">
            <li>Programming</li>
            <li>Gaming</li>
            <li>Badminton</li>
            <li>Traveling</li>
        </ol>
    </div>

</body>
</html>
